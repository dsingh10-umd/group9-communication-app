# Builds the container-api/ folder into a Docker image, publishes it to
# GitHub's free container registry (ghcr.io), then tells the Azure
# Container App to run the new image.

name: Build and deploy container API - group9-commapp-api

on:
  push:
    branches:
      - 'main'
    # Only run when the container API (or this workflow) changes
    paths:
      - 'container-api/**'
      - '.github/workflows/main_group9-commapp-api.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dsingh10-umd/group9-commapp-api
  RESOURCE_GROUP: Group9-CommunicationApp
  CONTAINER_APP: group9-commapp-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # needed for actions/checkout
      packages: write  # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile lives in container-api/, so that's the build context
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: container-api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # needed for the OIDC login to Azure
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_API_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_API_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_API_SUBSCRIPTION_ID }}

      # Tagging by commit SHA makes every push a new revision
      - name: Point the Container App at the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --output none
          # server.js listens on 8080
          az containerapp ingress update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --target-port 8080 \
            --output none
          echo "Deployed $IMAGE:${{ github.sha }}"
