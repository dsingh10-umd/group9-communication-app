<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerpComms — Group 9 Team Communication Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .hidden { display: none !important; }

    /* Login Gate */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .login-card h1 { margin-top: 0; font-size: 1.4rem; }
    .login-card label { display: block; margin: 0.85rem 0 0.35rem; color: var(--muted); font-size: 0.9rem; }
    .login-card input, .login-card select {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    /* Main Workspace Layout */
    #app-screen {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      min-height: 100vh;
    }
    aside, section { padding: 1.25rem; border-right: 1px solid var(--border); }
    section:last-child { border-right: none; }
    .brand { font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; }
    .user-badge {
      background: var(--panel);
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
    .nav-label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin: 1rem 0 0.4rem; }
    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 0.2rem;
    }
    .nav-btn:hover, .nav-btn.active { background: var(--panel-alt); color: #fff; font-weight: 600; }

    /* Buttons & Inputs */
    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    /* Feed & Composer */
    .feed-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .status-pill { font-size: 0.8rem; color: var(--muted); }
    #message-list {
      margin: 1rem 0;
      max-height: 60vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .msg-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    .composer { display: flex; flex-direction: column; gap: 0.5rem; background: var(--panel); padding: 0.85rem; border-radius: 8px; }
    .composer textarea {
      width: 100%;
      min-height: 65px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
    }

    /* Calendar Panel */
    .event-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem; margin-bottom: 0.6rem; font-size: 0.9rem; }
    .event-form input {
      width: 100%;
      margin-bottom: 0.5rem;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- 1. SIGN-IN GATE -->
  <div id="login-screen">
    <form id="login-form" class="login-card">
      <h1>TerpComms</h1>
      <p style="color: var(--muted); font-size: 0.9rem;">Sign in to access TerpComms channels, DMs, files, and calendar.</p>
      <label for="login-name">Display Name</label>
      <input id="login-name" type="text" placeholder="e.g., Briana" required />
      <label for="login-role">Team Role</label>
      <input
        id="login-role"
        type="text"
        list="role-suggestions"
        value="Member"
        placeholder="e.g., Team Lead, Developer, UI/UX"
        required
      />
      <datalist id="role-suggestions">
        <option value="Team Lead"></option>
        <option value="Developer"></option>
        <option value="UI/UX Designer"></option>
        <option value="Member"></option>
      </datalist>
      <button type="submit" class="primary" style="width: 100%;">Enter Workspace</button>
    </form>
  </div>

  <!-- 2. MAIN WORKSPACE -->
  <div id="app-screen" class="hidden">
    <!-- Left Sidebar: User + Channels + DMs -->
    <aside>
      <div class="brand">TerpComms</div>
      <div class="user-badge">
        <strong id="active-user-name">User</strong>
        <div id="active-user-role" style="color: var(--muted); font-size: 0.8rem;">Role</div>
        <button id="switch-user-btn" type="button" class="secondary">Switch User</button>
      </div>

      <div class="nav-label">Channels</div>
      <button class="nav-btn active" data-channel="general"># general</button>
      <button class="nav-btn" data-channel="announcements"># announcements</button>
      <button class="nav-btn" data-channel="dev-ops"># dev-ops</button>

      <div class="nav-label">Direct Messages</div>
      <button class="nav-btn" data-channel="dm-personal">@ Personal Notes</button>
      <button class="nav-btn" data-channel="dm-team-sync">@ Team Sync DM</button>
    </aside>

    <!-- Center Column: Channel / DM Feed & File Upload -->
    <section>
      <div class="feed-header">
        <h2 id="current-channel-title" style="margin: 0;"># general</h2>
        <span id="api-status" class="status-pill">API: Pending Container URL</span>
      </div>

      <div id="message-list"></div>

      <form id="message-form" class="composer">
        <textarea id="message-text" placeholder="Write a message or attach a file..."></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;">
          <input id="message-file" type="file" />
          <button type="submit" class="primary" style="margin-top: 0;">Send</button>
        </div>
      </form>
    </section>

    <!-- Right Column: Shared Calendar -->
    <section>
      <h3 style="margin-top: 0;">Team Calendar</h3>
      <div id="terp-cal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
        <button type="button" id="terp-cal-prev" class="secondary" style="margin-top:0;">&lt;</button>
        <strong id="terp-cal-label"></strong>
        <button type="button" id="terp-cal-next" class="secondary" style="margin-top:0;">&gt;</button>
      </div>
      <div id="terp-cal-grid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:0.25rem; text-align:center; font-size:0.8rem; margin-bottom:0.85rem;"></div>
      <form id="event-form" class="event-form">
        <input id="event-title" type="text" placeholder="Event title" required />
        <input id="event-date" type="date" required />
        <input id="event-time" type="time" />
        <button type="submit" class="primary" style="width: 100%; margin-top: 0.25rem;">Add Event</button>
      </form>
      <div id="event-list" style="margin-top: 1rem;"></div>
    </section>
  </div>

  <script>
    // Replace with your Azure Container App URL once Microsoft.App is registered
    const API_BASE = "";

    let currentChannel = "general";

    function getSession() {
      const raw = sessionStorage.getItem("terpcomms_user");
      return raw ? JSON.parse(raw) : null;
    }

    function setSession(userObj) {
      sessionStorage.setItem("terpcomms_user", JSON.stringify(userObj));
    }

    function renderAuthGate() {
      const user = getSession();
      const loginScreen = document.getElementById("login-screen");
      const appScreen = document.getElementById("app-screen");

      if (!user) {
        loginScreen.classList.remove("hidden");
        appScreen.classList.add("hidden");
        return;
      }

      loginScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      document.getElementById("active-user-name").textContent = user.userId;
      document.getElementById("active-user-role").textContent = user.role;
      document.getElementById("api-status").textContent = API_BASE
        ? "API: Connected"
        : "API: Local Preview (Set API_BASE when Container App is live)";

      loadMessages();
      loadEvents();
    }

    // Login Handler
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const userId = document.getElementById("login-name").value.trim();
      const role = document.getElementById("login-role").value.trim() || "Member";
      if (!userId) return;

      if (API_BASE) {
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId, role }),
          });
          if (res.ok) {
            const data = await res.json();
            setSession(data);
            renderAuthGate();
            return;
          }
        } catch (err) {
          console.warn("Backend login unavailable, falling back to local session:", err);
        }
      }

      setSession({ userId, role, token: "local-preview", loggedInAt: new Date().toISOString() });
      renderAuthGate();
    });

    // Switch User Handler
    document.getElementById("switch-user-btn").addEventListener("click", () => {
      sessionStorage.removeItem("terpcomms_user");
      renderAuthGate();
    });

    // Channel & DM Navigation
    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentChannel = btn.dataset.channel;
        document.getElementById("current-channel-title").textContent = btn.textContent;
        loadMessages();
      });
    });

    // Load Messages
    async function loadMessages() {
      const list = document.getElementById("message-list");
      list.innerHTML = "";

      if (!API_BASE) {
        list.innerHTML = `<div class="msg-card"><div class="msg-meta">System</div>Ready for <strong>${currentChannel}</strong>. Set <code>API_BASE</code> in <code>index.html</code> once your Container App URL is live.</div>`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/messages?channelId=${encodeURIComponent(currentChannel)}`);
        const data = await res.json();
        (data.messages || []).reverse().forEach((msg) => {
          const card = document.createElement("div");
          card.className = "msg-card";
          const fileLink = msg.fileUrl
            ? `<div style="margin-top:0.4rem;"><a href="${msg.fileUrl}" target="_blank" style="color:#60a5fa;">Attachment: ${msg.fileName || "Download"}</a></div>`
            : "";
          card.innerHTML = `
            <div class="msg-meta"><strong>${msg.userId}</strong> • ${new Date(msg.createdAt).toLocaleString()}</div>
            <div>${msg.text || ""}</div>
            ${fileLink}
          `;
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = `<div class="msg-card">Error loading messages: ${err.message}</div>`;
      }
    }

    // Post Message + Optional File
    document.getElementById("message-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = getSession();
      const text = document.getElementById("message-text").value.trim();
      const fileInput = document.getElementById("message-file");

      if (!text && !fileInput.files.length) return;
      if (!API_BASE) {
        alert("Set API_BASE in index.html once your Azure Container App URL is live.");
        return;
      }

      const formData = new FormData();
      formData.append("userId", user ? user.userId : "Anonymous");
      formData.append("channelId", currentChannel);
      formData.append("text", text);
      if (fileInput.files.length) {
        formData.append("file", fileInput.files[0]);
      }

      await fetch(`${API_BASE}/api/messages`, { method: "POST", body: formData });
      document.getElementById("message-text").value = "";
      fileInput.value = "";
      loadMessages();
    });

    // Load Events
    async function loadEvents() {
      const list = document.getElementById("event-list");
      list.innerHTML = "";
      if (!API_BASE) return;

      try {
        const res = await fetch(`${API_BASE}/api/events`);
        const data = await res.json();
        (data.events || []).forEach((ev) => {
          const card = document.createElement("div");
          card.className = "event-card";
          card.innerHTML = `<strong>${ev.title}</strong><div style="color:var(--muted);">${ev.date} ${ev.time || ""} • by ${ev.createdBy}</div>`;
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = `<div class="event-card">Error loading events: ${err.message}</div>`;
      }
    }

    // Add Event
    document.getElementById("event-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = getSession();
      const title = document.getElementById("event-title").value.trim();
      const date = document.getElementById("event-date").value;
      const time = document.getElementById("event-time").value;

      if (!title || !date) return;
      if (!API_BASE) {
        alert("Set API_BASE in index.html once your Azure Container App URL is live.");
        return;
      }

      await fetch(`${API_BASE}/api/events`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, date, time, createdBy: user ? user.userId : "Anonymous" }),
      });

      document.getElementById("event-title").value = "";
      document.getElementById("event-date").value = "";
      document.getElementById("event-time").value = "";
      loadEvents();
    });

    renderAuthGate();
    (function initTerpCalendar() {
      try {
        const grid = document.getElementById("terp-cal-grid");
        const label = document.getElementById("terp-cal-label");
        const prevBtn = document.getElementById("terp-cal-prev");
        const nextBtn = document.getElementById("terp-cal-next");
        const dateInput = document.getElementById("event-date");
        if (!grid || !label || !prevBtn || !nextBtn) return;

        let viewDate = new Date();

        function drawCalendar() {
          const year = viewDate.getFullYear();
          const month = viewDate.getMonth();
          label.textContent = viewDate.toLocaleDateString("en-US", {
            month: "long",
            year: "numeric",
          });

          const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
          const firstDay = new Date(year, month, 1).getDay();
          const totalDays = new Date(year, month + 1, 0).getDate();

          const now = new Date();
          const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

          grid.innerHTML = "";

          weekdays.forEach((dayName) => {
            const cell = document.createElement("div");
            cell.textContent = dayName;
            cell.style.color = "var(--muted)";
            cell.style.fontWeight = "600";
            cell.style.padding = "0.2rem 0";
            grid.appendChild(cell);
          });

          for (let i = 0; i < firstDay; i++) {
            grid.appendChild(document.createElement("div"));
          }

          for (let day = 1; day <= totalDays; day++) {
            const isoDate = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const dayBtn = document.createElement("button");
            dayBtn.type = "button";
            dayBtn.textContent = day;
            dayBtn.style.padding = "0.35rem 0";
            dayBtn.style.borderRadius = "6px";
            dayBtn.style.border = isoDate === todayKey ? "1px solid var(--accent)" : "1px solid var(--border)";
            dayBtn.style.background = isoDate === todayKey ? "var(--panel-alt)" : "var(--panel)";
            dayBtn.style.color = "var(--text)";
            dayBtn.style.cursor = "pointer";

            dayBtn.addEventListener("click", () => {
              if (dateInput) dateInput.value = isoDate;
            });

            grid.appendChild(dayBtn);
          }
        }

        prevBtn.addEventListener("click", () => {
          viewDate.setMonth(viewDate.getMonth() - 1);
          drawCalendar();
        });

        nextBtn.addEventListener("click", () => {
          viewDate.setMonth(viewDate.getMonth() + 1);
          drawCalendar();
        });

        drawCalendar();
      } catch (err) {
        console.warn("Calendar grid skipped:", err);
      }
    })();
    (function initLocalPreviewStorage() {
      const apiBaseValue = typeof API_BASE === "string" ? API_BASE.trim() : "";
      if (apiBaseValue !== "") return;

      const MSG_KEY = "terpcomms_local_messages_v1";
      const EVT_KEY = "terpcomms_local_events_v1";

      const readJson = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      };

      const writeJson = (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) {
          console.warn("Local storage write skipped:", err);
        }
      };

     const messageInput =
        document.getElementById("message-input") ||
        document.querySelector('textarea[placeholder*="Write a message"], textarea');
      const messageForm =
        document.getElementById("message-form") ||
        (messageInput ? messageInput.closest("form") : null);
      const fileInput =
        document.getElementById("message-file") ||
        (messageForm
          ? messageForm.querySelector('input[type="file"]')
          : document.querySelector('input[type="file"]'));
      const sendBtn = Array.from(document.querySelectorAll("button")).find(
        (btn) => btn.textContent.trim().toLowerCase() === "send"
      );
      const messageList =
        document.getElementById("message-list") ||
        (messageForm && messageForm.previousElementSibling
          ? messageForm.previousElementSibling
          : null);
      const eventForm = document.getElementById("event-form");
      const eventList = document.getElementById("event-list");

      const getActiveChannelId = () => {
        const activeNav = document.querySelector(
          "[data-channel].active, [data-channel-id].active, .channel-item.active, .active[data-channel], .active[data-channel-id]"
        );
        if (activeNav) {
          return (
            activeNav.dataset.channelId ||
            activeNav.dataset.channel ||
            activeNav.textContent.trim()
          );
        }
        const heading = document.querySelector("main h2, #active-channel-title, .channel-header h2");
        return heading ? heading.textContent.trim() : "# general";
      };

      const getCurrentUserLabel = () => {
        const aside = document.querySelector("aside");
        const switchBtn = aside
          ? Array.from(aside.querySelectorAll("button")).find((b) =>
              b.textContent.toLowerCase().includes("switch user")
            )
          : null;

        // Usually the name and role sit right above the "Switch User" button
        const block = switchBtn ? switchBtn.parentElement : aside;
        const nameEl =
          document.getElementById("current-user-name") ||
          document.querySelector("[data-user-name]") ||
          (block ? block.querySelector("strong, h2, h3, .user-name") : null);
        const roleEl =
          document.getElementById("current-user-role") ||
          document.querySelector("[data-user-role]") ||
          (block ? block.querySelector(".user-role, .role, small, p, div:nth-child(2)") : null);

        const rawName = nameEl ? nameEl.textContent.trim() : "";
        const rawRole = roleEl ? roleEl.textContent.trim() : "";

        const name = rawName || "User";
        const role = rawRole && rawRole !== rawName ? rawRole : "Member";
        return `${name} (${role})`;
      };

      const renderLocalMessages = () => {
        if (!messageList) return;
        const channelId = getActiveChannelId();
        const store = readJson(MSG_KEY, {});
        const items = Array.isArray(store[channelId]) ? store[channelId] : [];

        if (!items.length) return;

        messageList.innerHTML = "";
        items.forEach((msg) => {
          const card = document.createElement("div");
          card.style.padding = "0.65rem 0.85rem";
          card.style.marginBottom = "0.5rem";
          card.style.borderRadius = "8px";
          card.style.background = "var(--panel-alt)";
          card.style.border = "1px solid var(--border)";

          const meta = document.createElement("div");
          meta.style.fontSize = "0.78rem";
          meta.style.color = "var(--muted)";
          meta.style.marginBottom = "0.25rem";
          meta.textContent = `${msg.sender} • ${msg.time}`;

          const body = document.createElement("div");
          body.textContent = msg.text;

          card.appendChild(meta);
          card.appendChild(body);

         if (msg.fileName) {
            const att = document.createElement("div");
            att.style.fontSize = "0.78rem";
            att.style.marginTop = "0.3rem";

            if (msg.fileDataUrl) {
              const link = document.createElement("a");
              link.href = msg.fileDataUrl;
              link.target = "_blank";
              link.rel = "noopener";
              link.textContent = `Attachment: ${msg.fileName}`;
              link.style.color = "var(--accent)";
              link.style.textDecoration = "underline";
              att.appendChild(link);
            } else {
              att.style.color = "var(--muted)";
              att.textContent = `Attachment: ${msg.fileName} (preview only)`;
            }

            card.appendChild(att);
          }

          messageList.appendChild(card);
        });
      };

      const renderLocalEvents = () => {
        if (!eventList) return;
        const events = readJson(EVT_KEY, []);
        eventList.innerHTML = "";

        if (!events.length) {
          eventList.innerHTML = `<div style="color:var(--muted); font-size:0.85rem;">No local events added yet.</div>`;
          return;
        }

        events.forEach((evt) => {
          const row = document.createElement("div");
          row.style.padding = "0.55rem 0.7rem";
          row.style.marginBottom = "0.45rem";
          row.style.borderRadius = "6px";
          row.style.background = "var(--panel-alt)";
          row.style.border = "1px solid var(--border)";
          row.style.fontSize = "0.85rem";

          const title = document.createElement("div");
          title.style.fontWeight = "600";
          title.textContent = evt.title;

          const detail = document.createElement("div");
          detail.style.color = "var(--muted)";
          detail.style.fontSize = "0.78rem";
          detail.textContent = evt.time ? `${evt.date} at ${evt.time}` : evt.date;

          row.appendChild(title);
          row.appendChild(detail);
          eventList.appendChild(row);
        });
      };

      if (messageForm && messageInput) {
        messageForm.addEventListener(
          "submit",
          (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();

            const text = messageInput.value.trim();
            const file =
              fileInput && fileInput.files && fileInput.files[0]
                ? fileInput.files[0]
                : null;

            if (!text && !file) return;

            const saveMessage = (fileDataUrl) => {
              const channelId = getActiveChannelId();
              const store = readJson(MSG_KEY, {});
              if (!Array.isArray(store[channelId])) store[channelId] = [];

              store[channelId].push({
                sender: getCurrentUserLabel(),
                text: text || "(Attached file)",
                fileName: file ? file.name : "",
                fileDataUrl: fileDataUrl || "",
                time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
              });

              writeJson(MSG_KEY, store);
              messageInput.value = "";
              if (fileInput) fileInput.value = "";
              renderLocalMessages();
            };

            if (file && file.size <= 1024 * 1024) {
              const reader = new FileReader();
              reader.onload = () => saveMessage(reader.result);
              reader.readAsDataURL(file);
            } else if (file) {
              saveMessage("");
            } else {
              saveMessage("");
            }
          },
          true
        );
      }

      if (eventForm) {
        eventForm.addEventListener(
          "submit",
          (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();

            const titleEl = document.getElementById("event-title");
            const dateEl = document.getElementById("event-date");
            const timeEl = document.getElementById("event-time");

            const title = titleEl ? titleEl.value.trim() : "";
            const date = dateEl ? dateEl.value : "";
            const time = timeEl ? timeEl.value : "";

            if (!title || !date) return;

            const events = readJson(EVT_KEY, []);
            events.push({ title, date, time });
            writeJson(EVT_KEY, events);

            if (titleEl) titleEl.value = "";
            if (timeEl) timeEl.value = "";
            renderLocalEvents();
          },
          true
        );
      }

      document.addEventListener("click", () => {
        setTimeout(renderLocalMessages, 25);
      });

      renderLocalMessages();
      renderLocalEvents();
    })();
  </script>
</body>
</html>
