<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Counter &amp; Communication App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1e1b2e; }
    h1, h2 { color: #6644a8; margin-bottom: 4px; }
    .count { font-size: 72px; font-weight: 700; margin: 24px 0 8px; }
    button { font-size: 16px; padding: 10px 22px; border: 0; border-radius: 8px; background: #6644a8; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: #c4514c; }
    .small { color: #666; font-size: 14px; }
    hr { border: 0; border-top: 1px solid #e2dfec; margin: 32px 0; }
    .post-form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .post-form input[type="text"] { padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .post-card { border: 1px solid #e2dfec; border-radius: 8px; padding: 12px; margin-top: 12px; background: #faf9fc; }
    .post-meta { font-size: 12px; color: #666; margin-bottom: 4px; }
    .post-link { display: inline-block; margin-top: 6px; color: #6644a8; font-weight: 600; text-decoration: none; }
    .post-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Team Counter</h1>
  <p class="small">Website version: <strong>1</strong></p>

  <p class="count" id="count">…</p>
  <button id="addButton" disabled>Add 1</button>
  <p id="message" class="small"></p>

  <hr>

  <h2>Team Messages &amp; Uploads</h2>
  <form id="postForm" class="post-form">
    <input type="text" id="authorInput" placeholder="Your name (e.g., Briana)" value="Briana" required>
    <input type="text" id="textInput" placeholder="Write a message..." required>
    <input type="file" id="fileInput">
    <button type="submit" id="postButton" disabled>Post Message</button>
  </form>
  <p id="postStatus" class="small"></p>
  <div id="feed"></div>

  <hr>

  <h2>Our team</h2>
  <!-- Each teammate adds their own name here, then commits and pushes. -->
  <ul>
    <li>Briana Bristow</li>
  </ul>

  <p class="small">API: <span id="apiShown">loading…</span> · API version: <span id="apiVersion">?</span></p>

  <script>
    let API_BASE = "";

    const $ = (id) => document.getElementById(id);

    function showError(text) {
      $("message").textContent = text;
      $("message").className = "error";
    }

    // Calls one JSON function on the API and returns its JSON answer.
    async function callApi(functionName, method) {
      const url = API_BASE + "/" + functionName;
      let response;
      try {
        response = await fetch(url, { method: method });
      } catch (networkError) {
        throw new Error("Could not reach the API at " + url +
          ". Check the API_BASE setting on the Web App and CORS on the Function App.");
      }
      let data;
      try {
        data = await response.json();
      } catch (notJson) {
        throw new Error("Expected JSON from " + url + " but got something else (status " +
          response.status + "). API_BASE must be your Function App's address ending in /api.");
      }
      if (!response.ok) {
        throw new Error(data.error || ("The API answered with status " + response.status));
      }
      return data;
    }

    function show(data) {
      $("count").textContent = data.count;
      $("apiVersion").textContent = data.apiVersion;
    }

    function renderMessages(messages) {
      const feed = $("feed");
      feed.innerHTML = "";
      if (!messages || messages.length === 0) {
        feed.innerHTML = '<p class="small">No messages yet. Post the first one above!</p>';
        return;
      }

      messages.forEach((msg) => {
        const card = document.createElement("div");
        card.className = "post-card";

        const meta = document.createElement("div");
        meta.className = "post-meta";
        const dateStr = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : "";
        meta.textContent = `${msg.userId || "Anonymous"} · ${dateStr}`;
        card.appendChild(meta);

        const body = document.createElement("div");
        body.textContent = msg.text;
        card.appendChild(body);

        if (msg.attachmentUrl) {
          const link = document.createElement("a");
          link.className = "post-link";
          link.href = msg.attachmentUrl;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = "📎 " + (msg.fileName || "View Attachment");
          card.appendChild(link);
        }

        feed.appendChild(card);
      });
    }

    async function loadMessages() {
      try {
        const posts = await callApi("messages", "GET");
        renderMessages(posts);
      } catch (err) {
        $("postStatus").textContent = err.message;
        $("postStatus").className = "error";
      }
    }

    async function start() {
      // 1. Ask our own web server where the API lives (the API_BASE app setting).
      try {
        const config = await (await fetch("/config")).json();
        API_BASE = (config.apiBase || "").replace(/\/+$/, "");
      } catch (e) {
        API_BASE = "";
      }
      $("apiShown").textContent = API_BASE || "(not set)";
      if (!API_BASE) {
        showError("API_BASE is not set. Add it to the Web App's app settings: your Function App's address ending in /api.");
        return;
      }

      // 2. Read the current count and existing messages.
      try {
        show(await callApi("getCount", "GET"));
        $("addButton").disabled = false;
        $("postButton").disabled = false;
        await loadMessages();
      } catch (error) {
        showError(error.message);
      }
    }

    $("addButton").addEventListener("click", async () => {
      $("addButton").disabled = true;
      try {
        show(await callApi("addOne", "POST"));
        $("message").textContent = "";
      } catch (error) {
        showError(error.message);
      }
      $("addButton").disabled = false;
    });

    $("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("postButton").disabled = true;
      $("postStatus").textContent = "Posting...";
      $("postStatus").className = "small";

      try {
        const formData = new FormData();
        formData.append("userId", $("authorInput").value.trim() || "Anonymous");
        formData.append("text", $("textInput").value.trim());
        const file = $("fileInput").files[0];
        if (file) {
          formData.append("file", file);
        }

        const response = await fetch(API_BASE + "/messages", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || ("Failed with status " + response.status));
        }

        $("textInput").value = "";
        $("fileInput").value = "";
        $("postStatus").textContent = "Posted!";
        await loadMessages();
      } catch (error) {
        $("postStatus").textContent = error.message;
        $("postStatus").className = "error";
      }

      $("postButton").disabled = false;
    });

    start();
  </script>
</body>
</html>
