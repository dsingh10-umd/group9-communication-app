<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Counter & Comms</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #1f2937;
    }
    h1, h2 { color: #4c1d95; }
    .counter-box { margin-bottom: 1.5rem; }
    .count-num { font-size: 2.5rem; font-weight: 700; margin: 0.25rem 0; }
    button {
      background: #6d28d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #5b21b6; }
    button.secondary {
      background: #ede9fe;
      color: #4c1d95;
    }
    button.active {
      background: #4c1d95;
      color: #fff;
      outline: 2px solid #a78bfa;
    }
    .channels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .custom-room {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      padding: 0.5rem 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }
    .status { min-height: 1.25rem; font-size: 0.9rem; color: #4c1d95; }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      background: #fafafa;
    }
    .meta { font-size: 0.85rem; color: #64748b; margin-bottom: 0.25rem; }
    .attachment { display: inline-block; margin-top: 0.4rem; font-weight: 600; color: #5b21b6; }
    .small { font-size: 0.85rem; color: #64748b; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.75rem 0; }
  </style>
</head>
<body>
  <h1>Team Counter</h1>
  <p class="small">Website version: <strong>1</strong></p>

  <div class="counter-box">
    <div id="count" class="count-num">...</div>
    <button id="addBtn" type="button">Add 1</button>
  </div>

  <hr />

  <h2>Team Messages &amp; Uploads</h2>

  <div class="channels" id="channelButtons">
    <button type="button" class="secondary active" data-channel="general"># general</button>
    <button type="button" class="secondary" data-channel="project-chat"># project-chat</button>
    <button type="button" class="secondary" data-channel="dm:briana:devansh">DM: Briana &amp; Devansh</button>
  </div>

  <div class="custom-room">
    <input type="text" id="customChannelInput" placeholder="Custom room or 1-on-1 ID (e.g. dm:briana:teammate)..." />
    <button type="button" id="joinChannelBtn" class="secondary">Switch</button>
  </div>

  <p class="small">Active room: <strong id="activeChannelLabel"># general</strong></p>

  <form id="postForm">
    <input type="text" id="authorInput" value="Briana" placeholder="Your name..." />
    <input type="text" id="textInput" placeholder="Write a message..." />
    <input type="file" id="fileInput" />
    <button type="submit" id="postBtn">Post Message</button>
  </form>

  <div id="status" class="status"></div>
  <div id="feed"></div>

  <hr />

  <h2>Our team</h2>
  <ul>
    <li>Devansh Singh</li>
    <li>Briana Bristow</li>
  </ul>

  <p class="small">
    API: <span id="apiShown">loading...</span> · API version: <span id="apiVersion">?</span>
  </p>

  <script>
    const API_BASE = "https://group9-commapp-func.azurewebsites.net/api";
    const $ = (id) => document.getElementById(id);

    let currentChannel = "general";

    $("apiShown").textContent = API_BASE;

    function formatChannelLabel(ch) {
      if (ch === "general" || ch === "project-chat") return `# ${ch}`;
      return ch;
    }

    function setActiveChannel(channelId) {
      currentChannel = (channelId || "general").trim() || "general";
      $("activeChannelLabel").textContent = formatChannelLabel(currentChannel);

      document.querySelectorAll("#channelButtons button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.channel === currentChannel);
      });

      loadMessages();
    }

    document.querySelectorAll("#channelButtons button").forEach((btn) => {
      btn.addEventListener("click", () => setActiveChannel(btn.dataset.channel));
    });

    $("joinChannelBtn").addEventListener("click", () => {
      const val = $("customChannelInput").value.trim();
      if (val) setActiveChannel(val);
    });

    function showCount(data) {
      if (typeof data.count !== "undefined") $("count").textContent = data.count;
      if (data.apiVersion) $("apiVersion").textContent = data.apiVersion;
    }

    async function loadCount() {
      try {
        const res = await fetch(`${API_BASE}/getCount`);
        if (!res.ok) return;
        const data = await res.json();
        showCount(data);
      } catch (_) {}
    }

    $("addBtn").addEventListener("click", async () => {
      try {
        const res = await fetch(`${API_BASE}/addOne`, { method: "POST" });
        const data = await res.json();
        showCount(data);
      } catch (err) {
        $("status").textContent = "Counter error: " + err.message;
      }
    });

    function renderMessages(messages) {
      const feed = $("feed");
      feed.innerHTML = "";

      if (!messages || messages.length === 0) {
        feed.innerHTML = '<p class="small">No messages in this room yet. Post the first one above!</p>';
        return;
      }

      messages.forEach((msg) => {
        const card = document.createElement("div");
        card.className = "card";

        const meta = document.createElement("div");
        meta.className = "meta";
        const timeStr = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : "";
        meta.textContent = `${msg.userId || "Anonymous"} · ${formatChannelLabel(msg.channelId || "general")} · ${timeStr}`;
        card.appendChild(meta);

        if (msg.text) {
          const p = document.createElement("div");
          p.textContent = msg.text;
          card.appendChild(p);
        }

        if (msg.fileUrl && msg.fileName) {
          const link = document.createElement("a");
          link.className = "attachment";
          link.href = msg.fileUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = `📎 ${msg.fileName}`;
          card.appendChild(link);
        }

        feed.appendChild(card);
      });
    }

    async function loadMessages() {
      try {
        const url = `${API_BASE}/messages?channelId=${encodeURIComponent(currentChannel)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        renderMessages(data.messages || []);
      } catch (err) {
        $("status").textContent = "Failed to load messages: " + err.message;
      }
    }

    $("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("postBtn").disabled = true;
      $("status").textContent = "Posting...";

      try {
        const formData = new FormData();
        formData.append("userId", $("authorInput").value.trim() || "Anonymous");
        formData.append("text", $("textInput").value.trim());
        formData.append("channelId", currentChannel);

        const file = $("fileInput").files[0];
        if (file) {
          formData.append("file", file);
        }

        const res = await fetch(`${API_BASE}/messages`, {
          method: "POST",
          body: formData,
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Failed with status ${res.status}`);

        $("textInput").value = "";
        $("fileInput").value = "";
        $("status").textContent = "Posted!";
        await loadMessages();
      } catch (err) {
        $("status").textContent = "Error: " + err.message;
      } finally {
        $("postBtn").disabled = false;
      }
    });

    // Initial load + 5-second live polling for incoming text/files
    loadCount();
    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
